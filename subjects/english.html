<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>english | STS GROUP</title>
  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="logo-area"><img src="../logo.png" alt="STS GROUP">STS GROUP</a>
    <nav class="site-nav" id="siteNav">
      <a href="../index.html" data-lang="nav_home">الرئيسية</a>
      <a href="../index.html#subjects" data-lang="nav_subjects">الأقسام</a>
      <a href="../index.html#about" data-lang="nav_about">عن المجموعة</a>
    </nav>
    <div class="header-controls">
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang-btn data-lang="ar">عر</button>
        <button class="lang-btn" data-lang-btn data-lang="ku">کو</button>
      </div>
      <button class="theme-toggle"><span class="theme-icon">🌙</span></button>
      <button class="menu-toggle" id="menuToggle">☰</button>
    </div>
  </div>
</header>

<section class="page-hero">
  <div class="page-hero-inner">
    <button class="back-btn" onclick="goBack()">← <span data-lang="btn_back">العودة للأقسام</span></button>
    <h1 class="page-title">🌐 <span data-lang="subj_page_english">قسم</span></h1>
  </div>
</section>

<section class="resources-section">
  <div class="resources-grid">
    <a href="../english/books.html" class="resource-card fade-up">
      <div class="resource-icon">📘</div>
      <div class="resource-name" data-lang="btn_books">الكتاب الشامل</div>
    </a>
    <a href="../english/wazariyat.html" class="resource-card fade-up fade-up-2">
      <div class="resource-icon">📝</div>
      <div class="resource-name" data-lang="btn_wazariyat">الوزاريات</div>
    </a>
    <a href="../english/teachers.html" class="resource-card fade-up fade-up-3">
      <div class="resource-icon">👨‍🏫</div>
      <div class="resource-name" data-lang="btn_teachers">ملازم الأساتذة</div>
    </a>
    <a href="../english/explanations.html" class="resource-card fade-up fade-up-4">
      <div class="resource-icon">🎥</div>
      <div class="resource-name" data-lang="btn_explanations">الشروحات</div>
    </a>
    <a href="../english/questions.html" class="resource-card fade-up">
      <div class="resource-icon">❓</div>
      <div class="resource-name" data-lang="btn_questions">أسئلة وزارية</div>
    </a>
  </div>
</section>

<footer class="site-footer">© 2025 <span>STS GROUP</span> – <span data-lang="footer_rights">جميع الحقوق محفوظة</span></footer>

<script src="../js/lang.js"></script>
<script src="../js/theme.js"></script>
<script>
  const urlLang = new URLSearchParams(window.location.search).get('lang');
  if (urlLang && ['ar','ku'].includes(urlLang)) localStorage.setItem('sts_lang', urlLang);
  function goBack() { window.location.href = '../index.html?lang=' + LangManager.current + '#subjects'; }
  function updateThemeIcon() {
    const i = document.querySelector('.theme-icon');
    if(i) i.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
  }
  document.querySelector('.theme-toggle')?.addEventListener('click', updateThemeIcon);
  updateThemeIcon();
  document.getElementById('menuToggle')?.addEventListener('click', () => {
    document.getElementById('siteNav').classList.toggle('open');
  });
  const obs = new IntersectionObserver(es => es.forEach(e => {
    if(e.isIntersecting) e.target.style.opacity='1';
  }), {threshold:0.1});
  document.querySelectorAll('.fade-up').forEach(el => { el.style.opacity='0'; obs.observe(el); });
</script>
</body>
</html>
