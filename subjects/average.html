<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المعدلات | STS GROUP</title>
  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .calc-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem;max-width:700px;margin:2rem auto;box-shadow:var(--shadow);}
    .calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1.5rem 0;}
    .calc-group label{display:block;font-size:.85rem;font-weight:700;color:var(--text-muted);margin-bottom:.4rem;}
    .calc-group input{width:100%;padding:.65rem 1rem;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-section);color:var(--text);font-family:inherit;font-size:.95rem;transition:var(--transition);}
    .calc-group input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,77,.15);}
    .calc-btn{width:100%;padding:.875rem;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--primary);border:none;border-radius:var(--radius);font-family:inherit;font-size:1rem;font-weight:800;cursor:pointer;transition:var(--transition);margin-top:.5rem;}
    .calc-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(201,162,77,.35);}
    .result-box{margin-top:1.5rem;padding:1.5rem;background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:var(--radius);text-align:center;display:none;}
    .result-num{font-size:3rem;font-weight:900;color:var(--gold);}
    .result-label{color:rgba(255,255,255,.7);margin-top:.5rem;}
    @media(max-width:600px){.calc-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="logo-area"><img src="../logo.png" alt="STS GROUP">STS GROUP</a>
    <nav class="site-nav" id="siteNav">
      <a href="../index.html" data-lang="nav_home">الرئيسية</a>
      <a href="../index.html#subjects" data-lang="nav_subjects">الأقسام</a>
    </nav>
    <div class="header-controls">
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang-btn data-lang="ar">عر</button>
        <button class="lang-btn" data-lang-btn data-lang="ku">کو</button>
      </div>
      <button class="theme-toggle"><span class="theme-icon">🌙</span></button>
      <button class="menu-toggle" id="menuToggle">☰</button>
    </div>
  </div>
</header>

<section class="page-hero">
  <div class="page-hero-inner">
    <button class="back-btn" onclick="goBack()">← <span data-lang="btn_back">العودة للأقسام</span></button>
    <h1 class="page-title">📊 <span data-lang="subj_page_average">المعدلات</span></h1>
  </div>
</section>

<section class="resources-section">
  <div class="calc-card fade-up">
    <h2 style="font-weight:800;font-size:1.2rem;color:var(--gold);margin-bottom:.5rem;">حاسبة معدل البكلوريا</h2>
    <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:1rem;">أدخل درجاتك في كل مادة لحساب معدلك التقريبي</p>
    <div class="calc-grid">
      <div class="calc-group"><label>الأحياء</label><input type="number" min="0" max="100" placeholder="0-100" id="g1"></div>
      <div class="calc-group"><label>الرياضيات</label><input type="number" min="0" max="100" placeholder="0-100" id="g2"></div>
      <div class="calc-group"><label>الفيزياء</label><input type="number" min="0" max="100" placeholder="0-100" id="g3"></div>
      <div class="calc-group"><label>الكيمياء</label><input type="number" min="0" max="100" placeholder="0-100" id="g4"></div>
      <div class="calc-group"><label>اللغة العربية</label><input type="number" min="0" max="100" placeholder="0-100" id="g5"></div>
      <div class="calc-group"><label>اللغة الإنجليزية</label><input type="number" min="0" max="100" placeholder="0-100" id="g6"></div>
      <div class="calc-group"><label>اللغة الكوردية</label><input type="number" min="0" max="100" placeholder="0-100" id="g7"></div>
      <div class="calc-group"><label>التربية الإسلامية</label><input type="number" min="0" max="100" placeholder="0-100" id="g8"></div>
    </div>
    <button class="calc-btn" onclick="calcAverage()">احسب المعدل</button>
    <div class="result-box" id="resultBox">
      <div class="result-num" id="resultNum">0.00%</div>
      <div class="result-label">معدلك التقريبي</div>
    </div>
  </div>
</section>

<footer class="site-footer">© 2025 <span>STS GROUP</span> – <span data-lang="footer_rights">جميع الحقوق محفوظة</span></footer>

<script src="../js/lang.js"></script>
<script src="../js/theme.js"></script>
<script>
  const urlLang = new URLSearchParams(window.location.search).get('lang');
  if (urlLang && ['ar','ku'].includes(urlLang)) localStorage.setItem('sts_lang', urlLang);
  function goBack() { window.location.href = '../index.html?lang=' + LangManager.current + '#subjects'; }
  function updateThemeIcon() { const i = document.querySelector('.theme-icon'); if(i) i.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙'; }
  document.querySelector('.theme-toggle')?.addEventListener('click', updateThemeIcon);
  updateThemeIcon();
  document.getElementById('menuToggle')?.addEventListener('click', () => document.getElementById('siteNav').classList.toggle('open'));
  function calcAverage() {
    const ids = ['g1','g2','g3','g4','g5','g6','g7','g8'];
    let sum = 0, count = 0;
    ids.forEach(id => { const v = parseFloat(document.getElementById(id).value); if(!isNaN(v) && v>=0 && v<=100){sum+=v;count++;} });
    if(count===0){alert('أدخل درجة واحدة على الأقل');return;}
    document.getElementById('resultNum').textContent = (sum/count).toFixed(2) + '%';
    document.getElementById('resultBox').style.display = 'block';
  }
  const obs = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting) e.target.style.opacity='1'; }), {threshold:0.1});
  document.querySelectorAll('.fade-up').forEach(el => { el.style.opacity='0'; obs.observe(el); });
</script>
</body>
</html>
